<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reservas · Alexia</title><link rel="icon" href="icons/favicon-32.png"><link rel="stylesheet" href="css/reservas.css"><link rel="stylesheet" href="css/theme-refinements.css"><script src="js/admin.js" defer></script></head>
<body data-page="admin"><main class="admin-shell">
<header class="admin-header"><div class="admin-brand" aria-hidden="true">A</div><div><h1>Reservas de diagnóstico</h1><p>Alexia · Acceso privado</p></div><nav class="admin-nav" aria-label="Administración"><a class="admin-link" href="index.html">Ver sitio</a><button type="button" id="theme">Cambiar tema</button><button type="button" id="logout" hidden>Cerrar sesión</button></nav></header>
<section class="admin-login" id="login"><h2>Bienvenida</h2><p>Ingresa tu contraseña para consultar las solicitudes.</p><form id="login-form"><label class="admin-field" for="password">Contraseña<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit" class="primary">Entrar al panel</button></form><p class="admin-message error" id="login-error" role="alert"></p></section>
<section id="dashboard" hidden aria-label="Reservas registradas"><form class="admin-filters" id="filters"><label class="admin-field" for="from">Desde<input id="from" type="date"></label><label class="admin-field" for="to">Hasta<input id="to" type="date"></label><label class="admin-field" for="state">Estado<select id="state"><option value="">Todos</option value="registrada">Registradas</option><option value="confirmada">Confirmadas</option><option value="cancelada">Canceladas</option></select></label><button type="submit" class="primary">Actualizar</button><button type="button" id="export">Descargar CSV</button></form><p class="admin-message" id="message" role="status" aria-live="polite"></p><div class="booking-list" id="list"></div><nav class="admin-pagination" aria-label="Páginas de reservas"><button type="button" id="previous">Anterior</button><span id="page"></span><button type="button" id="next">Siguiente</button></nav></section>
</main></body></html>
