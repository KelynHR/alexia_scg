<!doctype html>
<html lang="es">
  <head>
    <script>
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        addEventListener("message", function (e) {
          if (e.data && e.data.alexiaTheme)
            document.documentElement.setAttribute(
              "data-theme",
              e.data.alexiaTheme,
            );
        });
      })();
    </script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Alexia SCG · Demos</title>

    <style id="apple">
      body.app {
        --bg: #fff;
        --surface: #fff;
        --soft: #f5f5f7;
        --line: rgba(0, 0, 0, 0.07);
        --ink: #1d1d1f;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --acc: #0071e3;
        --acc-soft: rgba(0, 113, 227, 0.08);
        --display:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          Arial, sans-serif;
        --body:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          Arial, sans-serif;
        font-size: 15px;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
      body.app::before {
        background: #fff;
      }
      body.app h1,
      body.app h2,
      body.app h3 {
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      body.app .eb {
        letter-spacing: 0.02em;
        text-transform: none;
        font-size: 12.5px;
        font-weight: 600;
      }
      body.app .box {
        border: 1px solid #e6e9ee;
        border-radius: 20px;
        box-shadow: none;
      }
      body.app .hero {
        border: 1px solid #e6e9ee;
        border-radius: 24px;
        background: #fff;
        box-shadow: none;
      }
      body.app .btn {
        border: 0;
        background: #0071e3;
        box-shadow: none;
        font-weight: 600;
        font-size: 14px;
        padding: 11px 20px;
        min-height: 44px;
      }
      body.app input,
      body.app select,
      body.app textarea {
        border-radius: 12px;
      }
      :root[data-theme="dark"] body.app {
        --bg: #000;
        --surface: #1c1c1e;
        --soft: #2c2c2e;
        --line: rgba(255, 255, 255, 0.1);
        --ink: #f5f5f7;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --acc: #2997ff;
        --acc-soft: rgba(41, 151, 255, 0.14);
        color-scheme: dark;
      }
      :root[data-theme="dark"] body.app::before {
        background: #000;
      }
      :root[data-theme="dark"] body.app .hero {
        background: #1c1c1e;
        border-color: rgba(255, 255, 255, 0.1);
      }
      :root[data-theme="dark"] body.app .box {
        border-color: rgba(255, 255, 255, 0.1);
      }
      :root[data-theme="dark"] body.app h1,
      :root[data-theme="dark"] body.app h2,
      :root[data-theme="dark"] body.app h3,
      :root[data-theme="dark"] body.app h4 {
        color: #f5f5f7 !important;
      }
    </style>
    <style id="responsive-fixes">
      /* Keep document scrolling on the root; constrain flexible children. */
      html {
        overflow-x: clip;
      }
      body {
        min-width: 0;
        overflow-wrap: break-word;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      main,
      section,
      article,
      form,
      fieldset {
        min-width: 0;
      }
      img,
      video {
        max-width: 100%;
        height: auto;
      }
      input,
      select,
      textarea {
        min-width: 0;
        max-width: 100%;
      }
      iframe {
        display: block;
        min-width: 0;
      }
      @media (max-width: 600px) {
        input,
        select,
        textarea {
          font-size: 16px;
        }
      }
    </style>
    <style>
      @media (min-width: 981px) {
        .side {
          height: auto;
          min-height: 100dvh;
          position: static;
        }
      }
      .range {
        min-width: 0;
      }
      .range > * {
        min-width: 0;
      }
      @media (max-width: 600px) {
        .range {
          grid-template-columns: minmax(0, 1fr) auto !important;
        }
        .range > label {
          grid-column: 1/-1;
        }
        .range input {
          width: 100%;
        }
        .topbar {
          flex-wrap: wrap;
        }
        .search {
          min-width: 0;
          max-width: 100%;
        }
        .phone {
          height: min(600px, 85dvh);
          min-height: 340px;
        }
      }
    </style>

    <style>
      /* Layout: app tipo producto SaaS: barra lateral navy con las 6 apps (color propio por app), barra superior y contenido con banner de color + tarjetas */
      :root {
        --navy: #0e3b57;
        --deep: #082a40;
        --glow: #175576;
        --grey: #b4b4b4;
        --c1: #2d7ff9;
        --c2: #14b8a6;
        --c3: #7b5cfa;
        --c4: #f2a93b;
        --c5: #f25c54;
        --c6: #175576;
        --bg: #ffffff;
        --surface: #ffffff;
        --line: #e6e9ee;
        --soft: #f5f6f8;
        --ink: #0e3b57;
        --text: #25303a;
        --muted: #66727e;
        --acc: #2d7ff9;
        --acc-ink: #ffffff;
        --acc-soft: rgba(45, 127, 249, 0.1);
        --display: Futura, "Futura PT", Jost, "Century Gothic", sans-serif;
        --body: Montserrat, "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 14px/1.55 var(--body);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: #fff;
      }
      h1,
      h2,
      h3 {
        font-family: var(--display);
        font-weight: 400;
        letter-spacing: -0.01em;
        text-wrap: balance;
        margin: 0;
      }
      .eb {
        font: 600 10.5px var(--body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
      }
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      /* sidebar */
      .side {
        min-width: 0;
        background: #ffffff;
        border-right: 1px solid var(--line);
        color: var(--ink);
        padding: 22px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding-left: max(14px, env(safe-area-inset-left, 0px));
      }
      .side img {
        height: 34px;
        margin-left: 8px;
      }
      .side .sprod {
        font: 600 10.5px var(--body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 8px;
      }
      .nav {
        display: grid;
        gap: 4px;
      }
      .nav button {
        all: unset;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 10px;
        border-radius: 14px;
        color: var(--text);
        font: 500 13.5px var(--body);
      }
      .nav button:hover {
        background: var(--soft);
      }
      .nav button[aria-selected="true"] {
        background: var(--acc-soft);
        color: var(--navy);
        font-weight: 600;
      }
      .nav button:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .nav .ic {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        color: #fff;
      }
      .nav .ic svg {
        width: 17px;
        height: 17px;
      }
      .side .foot {
        margin-top: auto;
        font-size: 11.5px;
        color: var(--muted);
        margin-inline: 8px;
        line-height: 1.5;
      }
      @media (max-width: 980px) {
        .side {
          position: sticky;
          top: env(safe-area-inset-top, 0px);
          height: auto;
          z-index: 15;
          padding: 12px max(16px, env(safe-area-inset-left, 0px)) 10px;
          gap: 10px;
        }
        .side .foot,
        .side .sprod {
          display: none;
        }
        .side img {
          height: 28px;
          margin: 0;
        }
        .nav {
          display: flex;
          overflow-x: auto;
          scrollbar-width: none;
          gap: 6px;
        }
        .nav::-webkit-scrollbar {
          display: none;
        }
        .nav button {
          flex: none;
          padding: 7px 10px 7px 7px;
          font-size: 12.5px;
        }
        .nav .ic {
          width: 26px;
          height: 26px;
        }
      }
      /* top bar */
      .mainc {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px max(24px, env(safe-area-inset-right, 0px)) 14px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      @media (max-width: 980px) {
        .topbar {
          display: none;
        }
      }
      .crumb {
        font-size: 13px;
        color: var(--muted);
      }
      .crumb b {
        color: var(--ink);
        font-weight: 600;
      }
      .search {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 14px;
        color: var(--muted);
        font-size: 12.5px;
        min-width: 220px;
        background: var(--soft);
      }
      .badge {
        font: 700 10px var(--body);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background: var(--acc-soft);
        color: var(--ink);
        border-radius: 999px;
        padding: 5px 10px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--c1), var(--c3));
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 600 12px var(--body);
      }
      main {
        padding: 24px max(24px, env(safe-area-inset-right, 0px)) 48px
          max(24px, env(safe-area-inset-left, 0px));
        max-width: 1320px;
        width: 100%;
      }
      @media (max-width: 600px) {
        main {
          padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px
            max(16px, env(safe-area-inset-left, 0px));
        }
      }
      /* hero banner */
      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 26px;
        padding: 30px 32px;
        color: var(--ink);
        background: linear-gradient(120deg, #ffffff 40%, var(--acc-soft) 100%);
        border: 1px solid var(--line);
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
        gap: 20px;
        align-items: center;
        min-height: 210px;
      }
      @media (max-width: 820px) {
        .hero {
          grid-template-columns: 1fr;
          padding: 22px;
          min-height: 0;
        }
        .hero .art {
          display: none;
        }
      }
      .hero .art {
        position: relative;
        height: 190px;
      }
      .hero .art svg {
        position: absolute;
        right: -10px;
        top: -10px;
        width: 110%;
        height: 120%;
      }
      .hero .eb {
        color: var(--acc);
      }
      .hero h2 {
        font-size: clamp(26px, 3.2vw, 38px);
        line-height: 1.1;
        margin-top: 10px;
        color: var(--navy);
      }
      .hero p {
        margin: 12px 0 0;
        color: var(--muted);
        max-width: 52ch;
        font-size: 15px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

    <script>
      const $ = (s, el = document) => el.querySelector(s);
      const fmt = (n, d = 0) =>
        n.toLocaleString("es-MX", {
          minimumFractionDigits: d,
          maximumFractionDigits: d,
        });
      const mxn = (n) => "$" + fmt(Math.round(n));
      const pct = (n, d = 1) => fmt(n * 100, d) + "%";
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // ---------- data ----------
      const CH = [
        {
          k: "web",
          n: "Tienda en línea",
          v: 21000,
          cr: 0.021,
          t: 2350,
          s: 190000,
        },
        { k: "ml", n: "Marketplace", v: 16000, cr: 0.031, t: 1680, s: 120000 },
        { k: "ig", n: "Instagram", v: 12500, cr: 0.012, t: 1420, s: 140000 },
        { k: "li", n: "LinkedIn", v: 4200, cr: 0.018, t: 6900, s: 160000 },
        { k: "wa", n: "WhatsApp", v: 3100, cr: 0.074, t: 3150, s: 45000 },
      ];
      let seed = 11;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const WEEKS = 12;
      const W = CH.map((c) =>
        Array.from({ length: WEEKS }, (_, i) => {
          const g = 1 + i * 0.022 + (rnd() - 0.5) * 0.14;
          const v = Math.round((c.v / 4.3) * g);
          const o = Math.round(v * c.cr * (1 + (rnd() - 0.5) * 0.2));
          return {
            v,
            o,
            rev: o * c.t * (1 + (rnd() - 0.5) * 0.1),
            sp: (c.s / 4.3) * (1 + (rnd() - 0.5) * 0.12),
          };
        }),
      );

      // ---------- chart helpers ----------
      function lineChart(vals, labels, w = 560, h = 190) {
        const pad = { l: 46, r: 12, t: 12, b: 24 },
          max = Math.max(...vals) * 1.1,
          min = 0;
        const x = (i) => pad.l + (i * (w - pad.l - pad.r)) / (vals.length - 1),
          y = (v) =>
            pad.t + (h - pad.t - pad.b) * (1 - (v - min) / (max - min));
        const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => min + (max - min) * f);
        const d = vals
          .map(
            (v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1),
          )
          .join(" ");
        return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Ventas por semana">
    ${ticks.map((t) => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(t) + 4}" text-anchor="end">${t >= 1e6 ? fmt(t / 1e6, 1) + " M" : fmt(t / 1e3, 0) + " k"}</text>`).join("")}
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs><path d="${d} L ${x(vals.length - 1)} ${y(0)} L ${x(0)} ${y(0)} Z" fill="url(#lg)"/>
    <path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="6" fill="var(--surface)" stroke="var(--acc)" stroke-width="3"/>
    ${labels.map((l, i) => (i % Math.ceil(labels.length / 6) === 0 || i === labels.length - 1 ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${l}</text>` : "")).join("")}</svg>`;
      }
      function hbars(rows, fmtv, w = 380) {
        const max = Math.max(...rows.map((r) => r[1])) || 1,
          h = rows.length * 34 + 6;
        return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Comparativo por canal">${rows

          })
          .join("")}</svg>`;

        function agg(ci, from, to) {
          return W[ci]
            .slice(from, to)
            .reduce(
              (a, w) => ({
                v: a.v + w.v,
                o: a.o + w.o,
                rev: a.rev + w.rev,
                sp: a.sp + w.sp,
              }),
              { v: 0, o: 0, rev: 0, sp: 0 },
            );
        }
        function draw() {
          const idx = CH.map((c, i) => i).filter((i) => sel.has(CH[i].k));
          const cur = idx.map((i) => agg(i, WEEKS - weeks, WEEKS)),
            prev = idx.map((i) =>
              agg(i, Math.max(0, WEEKS - 2 * weeks), WEEKS - weeks),
            );
          const S = (a) =>
            a.reduce(
              (t, x) => ({
                v: t.v + x.v,
                o: t.o + x.o,
                rev: t.rev + x.rev,
                sp: t.sp + x.sp,
              }),
              { v: 0, o: 0, rev: 0, sp: 0 },
            );
          const c = S(cur),
            p = S(prev),
            ch = (a, b) => (b ? a / b - 1 : 0);
          const K = [
            ["Ventas", mxn(c.rev), ch(c.rev, p.rev)],
            ["Pedidos", fmt(c.o), ch(c.o, p.o)],
            ["Conversión", pct(c.o / c.v, 2), ch(c.o / c.v, p.o / p.v)],
            ["Ticket promedio", mxn(c.rev / c.o), ch(c.rev / c.o, p.rev / p.o)],
            ["Costo por pedido", mxn(c.sp / c.o), ch(c.sp / c.o, p.sp / p.o)],

              ch(c.rev / c.sp, p.rev / p.sp),

          ).join("");

            idx.reduce((t, i) => t + W[i][WEEKS - weeks + j].rev, 0),
          );
          $("#lc", app).innerHTML = lineChart(
            series,
            series.map((_, j) => "S" + (WEEKS - weeks + j + 1)),

            .map((i, j) => [CH[i].n, cur[j].rev / cur[j].sp])

          $("#tb", app).innerHTML =
            `<table><thead><tr><th>Canal</th><th class="r">Visitas</th><th class="r">Pedidos</th><th class="r">Conversión</th><th class="r">Ventas</th><th class="r">Ticket</th><th class="r">ROAS</th></tr></thead><tbody>${idx

              .join("")}</tbody></table>`;

    const audio = new Audio(VOZ);
    window.__vozA = audio;

    playButton.hidden = true;
    stopButton.hidden = false;
    status.textContent = 'Reproduciendo llamada…';

    audio.onplay = () => {
      animateWave(true);
    };

    audio.onended = () => {
      animateWave(false);
      window.__vozA = null;

      status.textContent =
        'Llamada terminada · cotización enviada';

      playButton.hidden = false;
      stopButton.hidden = true;

      showCompletedAction();
    };

    audio.onerror = () => {
      animateWave(false);
      window.__vozA = null;

      status.textContent =
        'No se pudo cargar el audio. Revisa la ubicación del archivo.';

      playButton.hidden = false;
      stopButton.hidden = true;
    };

    audio.play().catch(() => {
      animateWave(false);
      window.__vozA = null;

      status.textContent =
        'No se pudo iniciar el audio. Intenta nuevamente.';

      playButton.hidden = false;
      stopButton.hidden = true;
    });
  };

  stopButton.onclick = () => {
    stopAudio();
    animateWave(false);

    playButton.hidden = false;
    stopButton.hidden = true;
    status.textContent = 'Llamada detenida';
  };
}
      const CHARTS = [

        const mini = (k) =>
          ({
            kpi: '<rect x="4" y="6" width="26" height="18" rx="4" fill="var(--acc)" opacity=".85"/><rect x="34" y="6" width="26" height="18" rx="4" fill="var(--acc)" opacity=".5"/><rect x="64" y="6" width="26" height="18" rx="4" fill="var(--acc)" opacity=".3"/>',
            line: '<path d="M4 30 L22 20 L40 24 L58 12 L76 16 L92 6" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>',
            bar: '<rect x="8" y="16" width="12" height="16" rx="2" fill="var(--acc)"/><rect x="28" y="8" width="12" height="24" rx="2" fill="var(--acc)" opacity=".7"/><rect x="48" y="20" width="12" height="12" rx="2" fill="var(--acc)" opacity=".5"/><rect x="68" y="4" width="12" height="28" rx="2" fill="var(--acc)" opacity=".85"/>',
            map: '<path d="M10 10 Q30 2 46 10 T84 8 L88 26 Q60 34 40 28 T8 30 Z" fill="var(--acc)" opacity=".25"/><circle cx="30" cy="16" r="4" fill="var(--acc)"/><circle cx="62" cy="20" r="6" fill="var(--acc)" opacity=".7"/>',
            table:
              '<rect x="4" y="4" width="88" height="6" rx="2" fill="var(--acc)" opacity=".6"/><rect x="4" y="14" width="88" height="5" rx="2" fill="#0E3B57" opacity=".12"/><rect x="4" y="22" width="88" height="5" rx="2" fill="#0E3B57" opacity=".12"/><rect x="4" y="30" width="60" height="5" rx="2" fill="#0E3B57" opacity=".12"/>',
            fc: '<path d="M4 28 L22 22 L40 24 L52 16" fill="none" stroke="var(--acc)" stroke-width="3"/><path d="M52 16 L70 12 L92 6" fill="none" stroke="#7B5CFA" stroke-width="3" stroke-dasharray="4 4"/><rect x="52" y="4" width="40" height="30" fill="#7B5CFA" opacity=".08"/>',
            al: '<rect x="4" y="6" width="88" height="10" rx="5" fill="#F25C54" opacity=".2"/><circle cx="12" cy="11" r="3" fill="#F25C54"/><rect x="4" y="22" width="88" height="10" rx="5" fill="#14B8A6" opacity=".2"/><circle cx="12" cy="27" r="3" fill="#14B8A6"/>',
            chat: '<rect x="4" y="4" width="56" height="12" rx="6" fill="#0E3B57" opacity=".12"/><rect x="34" y="20" width="58" height="14" rx="7" fill="var(--acc)" opacity=".6"/>',
          })[k];
        function draw() {
          $("#es", app).innerHTML = SRC.map(
            (s, i) =>
              `<button type="button" class="r" data-i="${i}" aria-pressed="${i === src}" style="cursor:pointer;text-align:left;font:inherit;${i === src ? "border-color:var(--acc);background:var(--acc-soft)" : ""}"><div><b>${s.n}</b><small>${s.s}</small></div><span class="pill ${i === src ? "hi" : ""}">${i === src ? "Elegido" : "Elegir"}</span></button>`,
          ).join("");
          $("#ec", app).innerHTML = CHARTS.map(
            (c) =>
              `<button type="button" data-k="${c.k}" aria-pressed="${sel.has(c.k)}" style="all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid ${sel.has(c.k) ? "var(--acc)" : "var(--line)"};background:${sel.has(c.k) ? "var(--acc-soft)" : "#fff"};border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px"><svg viewBox="0 0 96 38" width="100%" height="38" aria-hidden="true">${mini(c.k)}</svg><span style="font:600 12px var(--body);color:var(--ink)">${c.n}</span></button>`,
          ).join("");
          const base = [...sel].filter(
            (k) => !CHARTS.find((c) => c.k === k).ai,
          ).length;
          let lo, hi, tier;
          if (
            src === 0 &&
            base <= 2 &&
            !sel.has("fc") &&
            !sel.has("al") &&
            !sel.has("chat")
          ) {
            lo = 15000;
            hi = 18000;
            tier = "Dashboard directo";
          } else if (base <= 2) {

          } else if (base <= 4) {

          } else {
            lo = 315000;
            hi = 450000;
            tier = "Suite estratégica";

        }
