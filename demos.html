<style>
/* Layout: app tipo producto SaaS: barra lateral navy con las 6 apps (color propio por app), barra superior y contenido con banner de color + tarjetas */
:root{
  --navy:#0E3B57; --deep:#082A40; --glow:#175576; --grey:#B4B4B4;
  --c1:#2D7FF9; --c2:#14B8A6; --c3:#7B5CFA; --c4:#F2A93B; --c5:#F25C54; --c6:#175576;
  --bg:#FFFFFF; --surface:#FFFFFF; --line:#E6E9EE; --soft:#F5F6F8;
  --ink:#0E3B57; --text:#25303A; --muted:#66727E;
  --acc:#2D7FF9; --acc-ink:#FFFFFF; --acc-soft:rgba(45,127,249,.10);
  --display:Futura,"Futura PT",Jost,"Century Gothic",sans-serif;
  --body:Montserrat,"Segoe UI",system-ui,sans-serif;
}


*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:#fff}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
.eb{font:600 10.5px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
/* sidebar */
.side{min-width:0;background:#FFFFFF;border-right:1px solid var(--line);color:var(--ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side img{height:34px;margin-left:8px}
.side .sprod{font:600 10.5px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 8px}
.nav{display:grid;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:var(--text);font:500 13.5px var(--body)}
.nav button:hover{background:var(--soft)}
.nav button[aria-selected="true"]{background:var(--acc-soft);color:var(--navy);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nav .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.nav .ic svg{width:17px;height:17px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--muted);margin-inline:8px;line-height:1.5}
@media (max-width:980px){.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:15;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;gap:10px}.side .foot,.side .sprod{display:none}.side img{height:28px;margin:0}.nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:6px}.nav::-webkit-scrollbar{display:none}.nav button{flex:none;padding:7px 10px 7px 7px;font-size:12.5px}.nav .ic{width:26px;height:26px}}
/* top bar */
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px max(24px,env(safe-area-inset-right,0px)) 14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
@media (max-width:980px){.topbar{display:none}}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--muted);font-size:12.5px;min-width:220px;background:var(--soft)}
.badge{font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;background:var(--acc-soft);color:var(--ink);border-radius:999px;padding:5px 10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;display:flex;align-items:center;justify-content:center;font:600 12px var(--body)}
main{padding:24px max(24px,env(safe-area-inset-right,0px)) 48px max(24px,env(safe-area-inset-left,0px));max-width:1320px;width:100%}
@media (max-width:600px){main{padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}}
/* hero banner */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:30px 32px;color:var(--ink);background:linear-gradient(120deg,#FFFFFF 40%,var(--acc-soft) 100%);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center;min-height:210px}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:22px;min-height:0}.hero .art{display:none}}
.hero .art{position:relative;height:190px}.hero .art svg{position:absolute;right:-10px;top:-10px;width:110%;height:120%}
.hero .eb{color:var(--acc)}
.hero h2{font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin-top:10px;color:var(--navy)}
.hero p{margin:12px 0 0;color:var(--muted);max-width:52ch;font-size:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .orb{transform-origin:240px 105px;animation:spin 40s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hero .fl{animation:bob 5s ease-in-out infinite}
.hero ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;position:relative;z-index:1}
.hero li{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 12px;font-size:13px}
.hero li i{width:20px;height:20px;border-radius:6px;background:var(--acc);flex:none;display:flex;align-items:center;justify-content:center;color:var(--acc-ink);font-style:normal;font-size:12px;font-weight:700}
.sample{font-size:12px;color:var(--muted);margin:12px 4px 0}
.app{margin-top:16px;min-width:0}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=number]{font:500 13px var(--body);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chipb{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chipb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--grey))}
.chipb[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--ink)}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:9px 18px;font-weight:700;font-size:13px;box-shadow:0 6px 16px rgba(14,59,87,.14)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
@media (min-width:1180px){.kpis:has(.kpi:nth-child(6):last-child){grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpis{gap:12px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 16px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--acc))}
.kpi:nth-child(6n+1){--k:var(--c1)}.kpi:nth-child(6n+2){--k:var(--c2)}.kpi:nth-child(6n+3){--k:var(--c3)}.kpi:nth-child(6n+4){--k:var(--c4)}.kpi:nth-child(6n+5){--k:var(--c5)}.kpi:nth-child(6n+6){--k:var(--c6)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font:500 24px var(--display);color:var(--ink);margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--muted)}
.kpi .d.up{color:#13865F}.kpi .d.dn{color:#C0392B}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.box h3{font:600 13.5px var(--body);color:var(--ink);margin-bottom:10px}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--soft)}
td.r,th.r{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted)}
.pill.hi{background:rgba(19,134,95,.14);color:#0F7A55}
.pill.mid{background:rgba(242,169,59,.18);color:#9A5B00}
.pill.lo{background:rgba(192,57,43,.12);color:#B03A2E}
@media (max-width:0px){:root:not([data-theme="light"]) .pill.hi{color:#5FD3A6}:root:not([data-theme="light"]) .pill.mid{color:#F6C677}:root:not([data-theme="light"]) .pill.lo{color:#F59A8F}:root:not([data-theme="light"]) .kpi .d.up{color:#5FD3A6}:root:not([data-theme="light"]) .kpi .d.dn{color:#F59A8F}}
:root[data-theme="dark"] .pill.hi{color:#5FD3A6}:root[data-theme="dark"] .pill.mid{color:#F6C677}:root[data-theme="dark"] .pill.lo{color:#F59A8F}
.reco{margin-top:14px;background:var(--acc-soft);color:var(--ink);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;border-left:6px solid var(--acc)}
.reco b{display:block;font-size:13.5px}
.reco span{font-size:13px;color:var(--text)}
svg text{fill:var(--muted);font:500 11px var(--body)}
.range{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.range input{width:100%;accent-color:var(--acc)}
/* whatsapp */
.wa{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px}
@media (max-width:820px){.wa{grid-template-columns:1fr}}
.phone{border:10px solid #0B1A24;border-radius:38px;overflow:hidden;background:#ECE5DD;display:flex;flex-direction:column;height:600px;box-shadow:0 24px 50px rgba(8,42,64,.28)}
.phone .hd{background:#075E54;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.phone .av{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#075E54;font:600 14px var(--display)}
.phone .hd small{display:block;color:#CDEAE5;font-size:11px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-line;color:#1B2328;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.m.bot{background:#FFFFFF;border-top-left-radius:3px}
.m.me{background:#DCF8C6;align-self:flex-end;border-top-right-radius:3px}
.qr{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#F7F7F7;border-top:1px solid #DDD}
.qr button{border:1px solid #128C7E;color:#075E54;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.typing{font-size:12px;color:#5E6A72;padding-left:4px}
.log{display:grid;gap:8px}
.log .e{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:13px}
.log .e small{color:var(--muted);display:block}
.log .e b{display:block}
/* timeline */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px}
@media (max-width:640px){.steps{grid-template-columns:1fr 1fr}}
.step{border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:12.5px;background:var(--soft)}
.step.done{background:var(--acc);color:var(--acc-ink);border:1px solid var(--acc)}
.step b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c3),var(--c5))}
/* cotizador */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 0 12px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden}
.prod .ph{height:96px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--soft),var(--acc-soft))}
.prod .ph svg{width:54px;height:54px;color:var(--acc)}
.prod>*:not(.ph){margin-inline:12px}
.prod .sku{font-size:11px;color:var(--muted);letter-spacing:.06em}
.prod b{font-size:13px;color:var(--ink)}
.prod .pr{font:500 19px var(--display);color:var(--ink)}
.prod>.note{margin-inline:12px!important}
.prod .qty{display:flex;align-items:center;gap:6px;margin-top:auto}
.prod .qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.prod .qty input{width:62px;text-align:center}
.quote{margin-top:14px}
.tot td{border:0;padding:4px 8px}
.tot tr:last-child td{font-weight:700;color:var(--ink);font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.doc{margin-top:14px;border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:14px;padding:16px;white-space:pre-wrap;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--surface)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.grp{font:600 10px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.grp:first-child{margin-top:0}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--navy);text-decoration:none;font:600 12.5px var(--body);margin:0 8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.back:hover{background:var(--soft)}
@media (max-width:980px){.grp{display:none}.back{display:none}}
/* ciclo */
.auto4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:1100px){.auto4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.auto4{grid-template-columns:1fr}}
.a4{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit}
.a4:hover{box-shadow:0 14px 30px rgba(14,59,87,.10);transform:translateY(-2px)}
.a4{transition:transform .2s,box-shadow .2s}
.a4 .n{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.a4 h4{margin:4px 0 0;font:500 20px var(--display);color:var(--ink)}
.a4 p{margin:0;font-size:13px;color:var(--muted)}
.a4 .kp{font:600 12px var(--body);color:var(--ink);background:var(--soft);border-radius:10px;padding:8px 10px}
.a4 .hh{font:500 22px var(--display);color:var(--ink)}
.a4 .go{font:700 12px var(--body);color:var(--ink);margin-top:auto}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;margin-top:14px}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.calc .range{grid-template-columns:170px minmax(0,1fr) 110px}
@media (max-width:560px){.calc .range{grid-template-columns:1fr}}
.big{font:500 40px var(--display);color:var(--ink);line-height:1.05}
.src{font-size:11.5px;color:var(--muted);margin-top:10px}
/* agenda */
.cal{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr));gap:4px;font-size:12px}
.cal .hd{font:600 11px var(--body);color:var(--muted);text-align:center;padding:4px 0}
.cal .hr{font:500 11px var(--body);color:var(--muted);text-align:right;padding-right:6px;line-height:30px}
.slot{height:30px;border-radius:8px;background:var(--soft);border:1px dashed var(--line);font:600 10.5px var(--body);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 4px}
.slot.busy{background:#E6EBF0;border:1px solid var(--line);color:var(--muted)}
.slot.new{background:var(--acc);color:var(--acc-ink);border:1px solid var(--acc);animation:pop .4s ease}
.slot.ok{background:#0F7A55;color:#fff;border:1px solid #0F7A55}
.slot.rs{background:#F2A93B;color:#0E3B57;border:1px solid #F2A93B}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.req{display:grid;gap:8px}
.req .r{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.req .r small{display:block;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.embed .side,.embed .topbar{display:none}.embed .layout{grid-template-columns:1fr}
</style>

// ---------- chart helpers ----------
function lineChart(vals, labels, w = 560, h = 190) {
  const pad = { l: 46, r: 12, t: 12, b: 24 }, max = Math.max(...vals) * 1.1, min = 0;
  const x = i => pad.l + i * (w - pad.l - pad.r) / (vals.length - 1), y = v => pad.t + (h - pad.t - pad.b) * (1 - (v - min) / (max - min));
  const ticks = [0, .25, .5, .75, 1].map(f => min + (max - min) * f);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Ventas por semana">
    ${ticks.map(t => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(t) + 4}" text-anchor="end">${t >= 1e6 ? fmt(t / 1e6, 1) + ' M' : fmt(t / 1e3, 0) + ' k'}</text>`).join('')}
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs><path d="${d} L ${x(vals.length - 1)} ${y(0)} L ${x(0)} ${y(0)} Z" fill="url(#lg)"/>
    <path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="6" fill="var(--surface)" stroke="var(--acc)" stroke-width="3"/>
    ${labels.map((l, i) => i % Math.ceil(labels.length / 6) === 0 || i === labels.length - 1 ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${l}</text>` : '').join('')}</svg>`;
}
function hbars(rows, fmtv, w = 380) {
  const max = Math.max(...rows.map(r => r[1])) || 1, h = rows.length * 34 + 6;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Comparativo por canal">${rows.map(([n, v], i) => { const bw = (w - 140) * v / max; return `<text x="0" y="${i * 34 + 20}">${n}</text><rect x="108" y="${i * 34 + 8}" width="${Math.max(2, bw)}" height="16" rx="4" fill="var(--c${(i % 6) + 1})"/><text x="${112 + bw}" y="${i * 34 + 20}">${fmtv(v)}</text>`; }).join('')}</svg>`;
}

    const series = Array.from({ length: weeks }, (_, j) => idx.reduce((t, i) => t + W[i][WEEKS - weeks + j].rev, 0));

const DAYS = ['Lun 2', 'Mar 3', 'Mié 4', 'Jue 5', 'Vie 6'];
const HOURS = ['9:00', '10:00', '11:00', '12:00', '13:00', '16:00', '17:00'];
const BUSY = [[0, 0], [0, 3], [1, 1], [1, 2], [2, 0], [2, 4], [2, 5], [3, 1], [3, 6], [4, 0], [4, 2], [4, 3]];
const REQ = [
  { n: 'Directora de Compras', co: 'Distribuidora del Centro', ch: 'WhatsApp', pref: 1, ok: 'confirma' },
  { n: 'Gerente de Planta', co: 'Grupo Norte', ch: 'Formulario web', pref: 2, ok: 'reagenda' },

  function reset() { cal = DAYS.map(() => HOURS.map(() => null)); BUSY.forEach(([d, h]) => cal[d][h] = { t: 'Ocupado', c: 'busy' }); queue = REQ.map(r => ({ ...r, slot: null, st: 'Pendiente' })); sent = 0; phase = 0; $('#cf', app).disabled = true; $('#ag', app).disabled = false; $('#msg', app).hidden = true; draw(); }
  function free(from) { for (let d = from; d < DAYS.length; d++) for (let h = 0; h < HOURS.length; h++) if (!cal[d][h]) return [d, h]; for (let d = 0; d < from; d++) for (let h = 0; h < HOURS.length; h++) if (!cal[d][h]) return [d, h]; return null; }

  $('#rs', app).onclick = reset;

}

  const go = m => { COTMODE = m; if (window.__vozA) { window.__vozA.pause(); window.__vozA = null; } [...$('#cm', app).children].forEach(b => { b.setAttribute('aria-selected', b.dataset.m === m); b.setAttribute('aria-pressed', b.dataset.m === m); }); const c = $('#cbody', app); c.innerHTML = ''; ({ catalogo: renderCatalog, voz: renderVoz, tablero: renderEstimador })[m](c); };

const CALL = [
  ['c', '¡Hola, buenas tardes! ¿Me cotiza cincuenta bandas de transmisión BT-45, por favor?'],
  ['a', '¡Claro que sí! La BT-45 está en cuatrocientos veinte pesos por pieza. Y tenemos trescientas ochenta en existencia.'],

  ['a', 'Con mucho gusto. ¡Que tenga muy buena tarde!'],
];
function renderVoz(app) {
  app.innerHTML = `<div class="grid2"><div class="box" style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 18px;background:linear-gradient(180deg,#fff,var(--acc-soft))"><div style="width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,#14B8A6,#0E3B57);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 20px 40px rgba(20,184,166,.35)">${svgI('chat', 40)}</div><b style="font:500 20px var(--display);color:var(--ink)">Agente de voz Alexia</b><span class="note" style="margin:0" id="vst">Llamada entrante · Refacciones Ejemplo</span><div id="wave" aria-hidden="true" style="display:flex;gap:4px;align-items:center;height:44px">${Array.from({ length: 24 }, () => '<i style="display:block;width:4px;height:6px;border-radius:2px;background:#14B8A6;transition:height .1s"></i>').join('')}</div><div class="ctrl" style="justify-content:center"><button type="button" class="btn" id="vp">Escuchar llamada</button><button type="button" class="btn ghost" id="vs" hidden>Detener</button></div><p class="note" style="text-align:center;margin:0">Voces neuronales en español de México · agente y cliente</p></div><div class="box"><h3>Transcripción y acciones</h3><div class="log" id="vt" aria-live="polite"></div></div></div>`;
  const vt = $('#vt', app), bars = [...app.querySelectorAll('#wave i')]; let timer = null, run = 0;
  const wave = (on, w) => { clearInterval(timer); bars.forEach(b => b.style.background = w === 'c' ? '#8A97A3' : '#14B8A6'); if (on) timer = setInterval(() => bars.forEach(b => b.style.height = (6 + Math.random() * 36) + 'px'), 90); else bars.forEach(b => b.style.height = '6px'); };
  const stopAudio = () => { if (window.__vozA) { window.__vozA.pause(); window.__vozA = null; } };
  function line(i, r) {
    if (r !== run) return;
    if (i >= CALL.length) { wave(false); $('#vst', app).textContent = 'Llamada terminada · cotización enviada'; $('#vp', app).hidden = false; $('#vs', app).hidden = true; const e = document.createElement('div'); e.className = 'e'; e.innerHTML = '<b>CRM actualizado</b><small>Cotización C-2481 · 50 × BT-45 · $23,142 con IVA · enviada por WhatsApp</small>'; vt.appendChild(e); return; }
    const [w, t] = CALL[i]; const prev = vt.lastElementChild; let e;
    if (prev && prev.dataset.w === w) { e = prev; e.querySelector('span').textContent += ' ' + t; } else { e = document.createElement('div'); e.className = 'e'; e.dataset.w = w; e.style.borderLeftColor = w === 'a' ? '#14B8A6' : '#B4B4B4'; e.innerHTML = `<b>${w === 'a' ? 'Agente Alexia' : 'Cliente'}</b><span>${t}</span>`; vt.appendChild(e); }
    e.scrollIntoView({ block: 'nearest' });
    $('#vst', app).textContent = w === 'a' ? 'El agente está hablando…' : 'El cliente está hablando…';
    const next = () => { wave(false); setTimeout(() => line(i + 1, r), CALL[i + 1] && CALL[i + 1][0] === w ? 90 : 260); };
    const au = new Audio('data:audio/mpeg;base64,' + VOZ[i]); window.__vozA = au;
    au.onplay = () => wave(true, w); au.onended = next; au.onerror = () => setTimeout(next, 1200);
    au.play().catch(() => { wave(true, w); setTimeout(next, Math.max(1400, t.length * 55)); });
  }
  $('#vp', app).onclick = () => { run++; stopAudio(); vt.innerHTML = ''; $('#vp', app).hidden = true; $('#vs', app).hidden = false; line(0, run); };
  $('#vs', app).onclick = () => { run++; stopAudio(); wave(false); $('#vp', app).hidden = false; $('#vs', app).hidden = true; $('#vst', app).textContent = 'Llamada detenida'; };
}

    $('#ec', app).innerHTML = CHARTS.map(c => `<button type="button" data-k="${c.k}" aria-pressed="${sel.has(c.k)}" style="all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid ${sel.has(c.k) ? 'var(--acc)' : 'var(--line)'};background:${sel.has(c.k) ? 'var(--acc-soft)' : '#fff'};border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px"><svg viewBox="0 0 96 38" width="100%" height="38" aria-hidden="true">${mini(c.k)}</svg><span style="font:600 12px var(--body);color:var(--ink)">${c.n}</span></button>`).join('');

    else if (base <= 2) { lo = 57500; hi = 80000; tier = 'Tablero ejecutivo básico'; }
