}

function sheetLinea(el, id) {

  <h4>Ventas mensuales</h4>${legend([[C.blue, '' + c.Y], [C.gray2, '' + c.YP]])}${box('sh-1', 200)}
  <h4>Margen bruto mensual</h4>${box('sh-2', 180)}
  <h4>Productos</h4><div class="table-wrap"><table><thead><tr><th>Producto</th><th class="r">Ventas</th><th class="r">vs ${c.vsCol}</th><th class="r">Margen</th><th></th></tr></thead><tbody>${PRODS.filter(x => x.line === id).map(x => `<tr class="click" data-open="prod:${x.id}" data-push="1"><td><b>${x.name}</b><div class="muted s">${x.id}</div></td><td class="r">${$M(prodSales(x.id, c.ids, c.cur))}</td><td class="r">${delta(growth(prodSales(x.id, c.ids, c.cur), prodSales(x.id, c.ids, c.prev)))}</td><td class="r">${pct(prodMarg(x.id, c.ids, c.cur))}</td><td class="chev-c">›</td></tr>`).join('')}</tbody></table></div>`;

function sheetPlanta(el, id) {

  const note = id === 'LEO' ? `<div class="callout bad"><b>Diagnóstico:</b> la prensa P-07 (600 t) tiene paros no programados por desgaste del troquel y falta de mantenimiento preventivo; su disponibilidad es de solo 68%. Como alimenta a la línea de Estampado, frena a toda la planta. <b>Sugerencia:</b> overhaul del troquel (≈ $1.8 M) y mantenimiento preventivo semanal; recuperaría unos 10 puntos de OEE en la planta.</div>` : `<div class="callout good"><b>Planta en buen nivel.</b> ${oee >= 80 ? 'Cerca de la meta de 85%.' : 'Mejorando mes con mes.'} El siguiente paso es estandarizar cambios rápidos de molde (SMED) para ganar disponibilidad.</div>`;

  trendChart('sheet', 'sh-1', [{ label: 'OEE', data: m.oee, color: SUC_COL[id], fill: id === 'LEO' ? 'rgba(224,53,43,.08)' : C.blueSoft }], { fmt: v => nf(v, 0) + '%', meta: OEE_META, min: 55, max: 95 });

function init() {
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  ALERTS = computeAlerts();
  document.getElementById('f-suc').innerHTML = `<option value="ALL">Todas las sucursales</option>` + SUC.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('f-yr').innerHTML = [2026, 2025].map(y => `<option value="${y}">${y}</option>`).join('');

  document.getElementById('f-suc').addEventListener('change', e => { state.suc = e.target.value; render(); });

  document.getElementById('f-cmp').innerHTML = '<option value="yoy">vs año anterior</option><option value="prev">vs periodo anterior</option>';
  document.getElementById('f-cmp').addEventListener('change', e => { state.cmp = e.target.value; if (!periodOk(state.year, state.per, state.cmp)) state.per = state.cmp === 'prev' ? lastFullQ(state.year) : 'YTD'; fillPer(); render(); });

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab],[data-alert],[data-open],[data-go],[data-kpi]'); if (!t) return;
    if (t.dataset.kpi) return goKpi(t.dataset.kpi);

    if (t.dataset.go) return setTab(t.dataset.go);

    if (t.dataset.open) { const [ty, k] = t.dataset.open.split(':'); openDetail(ty, k, !t.dataset.push); }
  });
  document.getElementById('sheet-back').addEventListener('click', backSheet);
  document.getElementById('sheet-x').addEventListener('click', closeSheet);
  document.getElementById('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.kpi) { e.preventDefault(); goKpi(e.target.dataset.kpi); } });
  window.addEventListener('hashchange', () => setTab(location.hash.slice(1) || 'resumen'));
  state.tab = TABS.find(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'resumen';

<button id="ag-fab" type="button" aria-label="Abrir Agente Alexia"><span class="orb"><i></i></span>Agente Alexia<b id="ag-n"></b></button>
<aside id="ag" aria-label="Agente Alexia"><header><span class="orb"></span><div><h3>Agente Alexia</h3><small>Detecta, propone y ejecuta con tu aprobación</small></div><button id="ag-x" type="button" aria-label="Cerrar">✕</button></header><div id="ag-b"></div></aside>
<script>
(function () {
  const ACT = {
    Cobranza: ['Enviar estado de cuenta y recordatorio por correo y WhatsApp', 'Agendar llamada con el cliente mañana a las 10:00', 'Pausar nuevos pedidos a crédito hasta regularizar'],
    'Producción': ['Abrir orden de mantenimiento para el equipo crítico', 'Avisar al gerente de planta', 'Reprogramar los pedidos afectados'],
    Ventas: ['Enviar resumen al gerente de la sucursal', 'Proponer plan de recuperación por cliente'],
    Inventario: ['Proponer liquidación con descuento', 'Pedir a Compras frenar el reabasto de esos productos'],
    Rentabilidad: ['Preparar propuesta de ajuste de precio', 'Avisar a Dirección Comercial'],
  };
  const el = id => document.getElementById(id);
  const list = () => (typeof ALERTS !== 'undefined' ? ALERTS : []);
  function open() { document.body.classList.add('ag-open'); home(); }
  function close() { document.body.classList.remove('ag-open'); }
  function home() {
    const A = list();
    el('ag-b').innerHTML = `<p style="margin:0 0 12px;font-size:14px;color:#6e6e73">Revisé ventas, cobranza, inventario y producción. Encontré ${A.length} puntos que requieren acción.</p>` +
      A.map((a, i) => `<button class="ag-c" data-ag="${i}" type="button"><div class="meta">${a.area} · ${a.sev === 'alta' ? 'Prioridad alta' : 'Atención'}</div><div class="t">${a.title}</div><div class="s">${a.sub}</div><span class="go">Ver qué propongo ›</span></button>`).join('') +
      `<p class="ag-note">Demo: el agente prepara las acciones, pero no envía mensajes ni crea órdenes reales.</p>`;
  }
  function detail(i) {
    const a = list()[i], acts = ACT[a.area] || ['Avisar al responsable'];
    el('ag-b').innerHTML = `<button type="button" id="ag-back" style="color:#0071e3;font-weight:500;margin-bottom:10px">‹ Alertas</button>
      <div class="ag-c"><div class="meta">Lo que detecté</div><div class="t">${a.title}</div><div class="s">${a.sub}</div><button type="button" class="go" id="ag-see">Ver en el tablero ›</button></div>
      <div class="ag-c"><div class="meta">Lo que propongo</div><div class="ag-acts">${acts.map((t, k) => `<label><input type="checkbox" checked id="ag-a${k}">${t}</label>`).join('')}</div>
      <button type="button" class="ag-btn" id="ag-run">Preparar acciones</button><div id="ag-out"></div></div>`;
    el('ag-back').onclick = home;
    el('ag-see').onclick = () => { close(); a.go(); };
    el('ag-run').onclick = () => run(a, acts);
  }
  function run(a, acts) {
    const chosen = acts.filter((_, k) => el('ag-a' + k) && el('ag-a' + k).checked);
    if (!chosen.length) { el('ag-out').innerHTML = '<p class="ag-note">Elige al menos una acción.</p>'; return; }
    el('ag-run').remove();
    const steps = ['Analizando datos del tablero', 'Redactando mensajes', 'Preparando tareas y responsables'];
    el('ag-out').innerHTML = `<ul class="ag-steps">${steps.map((s, k) => `<li id="ag-s${k}"><i>✓</i>${s}</li>`).join('')}</ul>`;
    steps.forEach((_, k) => setTimeout(() => { const li = el('ag-s' + k); if (li) li.classList.add('on'); }, 500 + k * 650));
    setTimeout(() => {
      const box = el('ag-out'); if (!box) return;
      box.innerHTML += `<div class="ag-draft"><b>Borrador listo para tu revisión</b>\n${a.area === 'Cobranza' ? 'Hola, le compartimos su estado de cuenta actualizado. Tenemos un saldo vencido pendiente; ¿podemos agendar mañana a las 10:00 para acordar fechas de pago?' : 'Resumen: ' + a.title + '\nAcciones: ' + chosen.join('; ') + '.'}</div>
      <button type="button" class="ag-btn" id="ag-ok">Aprobar y ejecutar</button><button type="button" class="ag-btn s" id="ag-cancel">Descartar</button>`;
      el('ag-ok').onclick = () => { el('ag-ok').remove(); el('ag-cancel').remove(); box.innerHTML += `<div class="ag-ok">✓ ${chosen.length} ${chosen.length === 1 ? 'acción ejecutada' : 'acciones ejecutadas'} (demo)</div>`; };
      el('ag-cancel').onclick = home;
    }, 500 + steps.length * 650 + 200);
  }
  /* insights del agente dentro de cada pestaña */
  const AREA_TAB = { resumen: null, ventas: ['Ventas'], cobranza: ['Cobranza'], inventario: ['Inventario'], produccion: ['Producción'], edr: ['Rentabilidad'], flujo: ['Cobranza', 'Inventario'] };
  const esc2 = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function strip() {
    const main = el('main'); if (!main || typeof state === 'undefined') return;
    const want = AREA_TAB[state.tab];
    let rows = list().map((a, i) => [a, i]).filter(([a]) => (state.suc === 'ALL' || !a.suc || a.suc === state.suc));
    rows = want ? rows.filter(([a]) => want.includes(a.area)) : rows.filter(([a]) => a.sev === 'alta');
    rows = rows.slice(0, 3);
    if (!rows.length) return;
    const html = `<div class="ag-strip" role="region" aria-label="Insights del Agente Alexia"><div class="ag-sh"><span class="orb"></span><b>Agente Alexia</b><small>${rows.length === 1 ? '1 acción sugerida' : rows.length + ' acciones sugeridas'}</small></div>` +
      rows.map(([a, i]) => `<div class="ag-row"><span class="dot" style="background:${a.sev === 'alta' ? '#ff3b30' : '#ff9f0a'}"></span><div class="tx"><b>${esc2(a.title)}</b><span><em>Propongo:</em> ${esc2((ACT[a.area] || ['Avisar al responsable'])[0])}.</span></div><button type="button" data-agi="${i}">Resolver</button></div>`).join('') + '</div>';
    const h = main.querySelector('section.head');
    if (h) h.insertAdjacentHTML('afterend', html); else main.insertAdjacentHTML('afterbegin', html);
  }
  function boot() {
    const n = list().filter(a => a.sev === 'alta').length; el('ag-n').textContent = n;
    el('ag-fab').onclick = open; el('ag-x').onclick = close;
    el('scrim').addEventListener('click', close);
